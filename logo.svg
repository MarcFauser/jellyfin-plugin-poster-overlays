    <text x="320" y="183" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">4K</text>

    <rect x="212" y="210" width="152" height="44" rx="9" fill="#111418" fill-opacity="0.88" stroke="#F5A524" stroke-opacity="0.75" stroke-width="2"/>
    <text x="288" y="241" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#F5A524" text-anchor="middle">DV HDR</text>
